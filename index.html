<script>
// ---------- screen: business overview v2 (simple, one screen) ----------
const RES_PLURAL={clicks:['переход','перехода','переходов'],views:['просмотр','просмотра','просмотров'],orders:['заказ','заказа','заказов']};
const UNIT_WORD={clicks:'переход',views:'1000 просмотров',orders:'заказ'};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function joinRu(a){return a.length<=1?a.join(''):a.slice(0,-1).join(', ')+' и '+a[a.length-1]}
function verdictBar(s,p){
  const g=G();const has=p.n>0;const t=state.targets[g.target];const cost=s[g.cost];
  let cls='flat',text='';
  if(cost==null){cls='bad';text=`${g.resultLabel} в этом периоде нет: ${g.costLabel} посчитать нельзя`}
  else if(!has||p[g.cost]==null){text=`${cap(UNIT_WORD[g.result])} стоит ${mf(g.cost,cost)}${has?', в прошлом периоде результата не было':', прошлого периода для сравнения нет'}`}
  else{
    const cC=chg(cost,p[g.cost]),cB=chg(s.budget,p.budget);const n=fmt(Math.abs(cC)*100,0);
    cls=cC<=-.05?'good':cC>=.05?'bad':'flat';
    const head=cC<=-.05?`Эффективность выросла на ${n}%`:cC>=.05?`Эффективность снизилась на ${n}%`:'Эффективность без изменений';
    text=`${head}: ${UNIT_WORD[g.result]} стоит ${mf(g.cost,cost)} вместо ${mf(g.cost,p[g.cost])}, бюджет ${cB==null?'—':(cB>=0?'+':'−')+fmt(Math.abs(cB)*100,0)+'%'}`;
  }
  const tgt=cost==null?'':cost<=t?` · в пределах цели ${mf(g.cost,t)}`:` · выше цели ${mf(g.cost,t)}`;
  return `<div class="verdictbar ${cls}"><span class="dot" aria-hidden="true"></span><span>${text}${tgt}</span></div>`;
}
function tiles4(s,p){
  const has=p.n>0;const g=G();
  const d=(k,key)=>has?dpill(s[k],p[k],key):pill('muted','нет базы');
  const was=(k,f)=>has?`<span class="w">было ${f(p[k])}</span>`:'';
  return `<div class="sumgrid four">
    <div class="sum"><div class="l">Потратили</div><div class="v">${money(s.budget)}</div><div class="d">${d('budget','neutral')}${was('budget',money)}</div></div>
    <div class="sum ${g.result==='views'?'goal':''}"><div class="l">Роликов · охват</div><div class="v">${fmt(s.n)} <small>·</small> ${fmtK(s.views)}</div><div class="d">${d('n','neutral')}${d('views','views')}${has?`<span class="w">было ${fmt(p.n)} · ${fmtK(p.views)}</span>`:''}</div></div>
    <div class="sum ${g.result==='clicks'?'goal':''}"><div class="l">Переходов</div><div class="v">${fmt(s.clicks)}</div><div class="d">${d('clicks','clicks')}${was('clicks',fmt)}</div></div>
    <div class="sum ${g.result==='orders'?'goal':''}"><div class="l">Заказов</div><div class="v">${fmt(s.orders)}</div><div class="d">${d('orders','orders')}${was('orders',fmt)}</div></div>
  </div>`;
}
function funnelSimple(s,p){
  const g=G();const has=p.n>0;
  const st=[
    {k:'budget',l:'Потратили',f:money,key:'neutral'},
    {k:'n',l:'Роликов вышло',f:fmt,key:'neutral'},
    {k:'views',l:'Просмотров',f:fmtK,key:'views'},
    {k:'clicks',l:'Переходов',f:fmt,key:'clicks'},
    {k:'orders',l:'Заказов',f:fmt,key:'orders'}];
  const per=(a,b)=>b?a/b:null;
  const conn=[
    ['за ролик',money(per(s.budget,s.n)),has?money(per(p.budget,p.n)):null,'средний бюджет одного ролика'],
    ['на ролик',fmtK(per(s.views,s.n)),has?fmtK(per(p.views,p.n)):null,'просмотров на один ролик'],
    ['CTR на 10k',mf('ctr',s.ctr),has?mf('ctr',p.ctr):null,'переходов на 10 000 просмотров'],
    ['CR',mf('cr',s.cr),has?mf('cr',p.cr):null,'доля переходов, ставших заказом']];

  let h='<div class="fchain">';

    if(i<st.length-1){const c=conn[i];h+=`<div class="fconn" data-tip="${esc(c[3])}"><span class="arr" aria-hidden="true">→</span><div class="cl">${c[0]}</div><div class="cv">${c[1]}</div><div class="cw">${c[2]?'было '+c[2]:''}</div></div>`}

function splitSimple(ctx){
  const {sum,recs,prevRecs}=ctx;const g=G();
  const dim=resolveSplit(recs);const dimLabel=DIMS[dim].label;
  const spv=new Map(groupBy(prevRecs,DIMS[dim].key).map(x=>[x.key,x.s]));

  let rows=sg,restRow=null;
  if(sg.length>5){
    const rest=sg.slice(5);rows=sg.slice(0,5);

    restRow=enrich([{key:'rest',list:rl,s:sumRecs(rl)}],sum)[0];restRow.name=`Остальные (${rest.length})`;
    const pr=prevRecs.filter(x=>keys.has(DIMS[dim].key(x.v)));restRow.prev=pr.length?sumRecs(pr):null;
  }

  const row=x=>{
    const p=x.key==='rest'?x.prev:(spv.get(x.key)||null);const pc=p?p[g.cost]:null;const isRest=x.key==='rest';
    return `<div class="srow ${isRest?'':'rowbtn'}"${isRest?'':` data-act="goDrivers" data-v="${dim}"`}><div class="sl">${dim==='platform'?pfDot(x.key):''}${esc(x.name||dimName(dim,x.key))}<div class="note">${x.s.n} ${plural(x.s.n,'ролик','ролика','роликов')} · ${pct(x.bShare)} бюджета</div></div><div class="bars"><div class="bar b" style="width:${(x.bShare/max*100).toFixed(1)}%" data-tip="${esc('доля бюджета '+pct(x.bShare))}"></div><div class="bar r" style="width:${(x.rShare/max*100).toFixed(1)}%" data-tip="${esc('доля '+g.resultGen+' '+pct(x.rShare))}"></div></div><div class="sc">${x.result?`${costSpan(x.cost)} ${dpill(x.cost,pc,g.cost)}`:`<span class="down">0 ${g.resultGen}</span>`}</div></div>`;
  };
  const title=sg.length<=3?joinRu(sg.map(x=>dimName(dim,x.key))):dimLabel;
  return card(esc(title),`<div class="srows">${rows.map(row).join('')}${restRow?row(restRow):''}</div><div class="legend"><span style="--c:var(--series-budget)">доля бюджета</span><span style="--c:var(--series-result)">доля ${g.resultGen}</span></div><div class="note">Главный разрез: ${dimLabel.toLowerCase()}${state.split==='auto'?' (авто)':''} · справа ${g.costLabel} и его изменение · клик открывает «Драйверы»</div>`,{span:7,hint:'куда ушли деньги и что они принесли'});
}
function productsSimple(ctx){
  const {sum,recs,prevRecs}=ctx;const g=G();
  const pv=new Map(groupBy(prevRecs,v=>v.product).map(x=>[x.key,x.s]));

  return card('Товары: что делать',`<div class="prows">${prods.map(x=>{const p=pv.get(x.key)||null;return `<div class="prow rowbtn" data-act="goProduct" data-v="${x.key}"><div>${esc(PRODUCT_BY_ID[x.key].short)}<span class="note"> · ${x.s.n} рол.</span></div><div>${pill(DECISION[x.status][1],DECISION[x.status][0])}</div><div class="sc">${x.result?`${costSpan(x.cost)} ${dpill(x.cost,p?p[g.cost]:null,g.cost)}`:`<span class="down">0 ${g.resultGen}</span>`}</div></div>`}).join('')}</div><div class="note">${g.costLabel} и его изменение к прошлому периоду · клик открывает товар</div>`,{span:5});
}
function reasonsSimple(ctx){
  const g=G();const mv=movers(ctx.recs,ctx.prevRecs).slice(0,3);
  state._insights=mv.map(m=>({go:m.screen==='products'?{screen:'products',product:m.key}:{screen:'drivers',dim:m.dim}}));

  return card('Что изменило картину',body,{span:12,hint:'три главные причины · клик ведёт вглубь'});

function renderExec2(ctx){

// ---------- navigation history (for the Back button) ----------
function snapshot(){return {screen:state.screen,dim:state.dim,paretoBy:state.paretoBy,page:state.page,sel:Object.assign({},state.sel),sort:JSON.parse(JSON.stringify(state.sort)),f:JSON.parse(JSON.stringify(state.f)),scroll:window.scrollY}}
function pushHist(){state.hist.push(snapshot());if(state.hist.length>30)state.hist.shift()}
function goBack(){const s=state.hist.pop();if(!s)return;state.screen=s.screen;state.dim=s.dim;state.paretoBy=s.paretoBy;state.page=s.page;state.sel=s.sel;state.sort=s.sort;state.f=s.f;render();window.scrollTo(0,s.scroll||0)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.hist.length&&!e.target.closest('input,select'))goBack()});

// ---------- events ----------
document.addEventListener('click',e=>{
  const th=e.target.closest('th[data-sort]');
  if(th){const sc=th.dataset.screen,k=th.dataset.sort;const s=state.sort[sc];if(s&&s.key===k)s.dir=-s.dir;else state.sort[sc]={key:k,dir:-1};render();return}
  const el=e.target.closest('[data-act]');if(!el)return;

  switch(a){
    case 'screen':if(v===state.screen)return;pushHist();state.screen=v;state.page=1;window.scrollTo(0,0);break;
    case 'back':goBack();return;
    case 'togglesb':document.getElementById('sidebar').classList.toggle('open');return;
    case 'goal':state.goal=v;state.sort={};break;
    case 'split':state.split=v;break;
    case 'morefilters':state.moreFilters=!state.moreFilters;break;
    case 'goDrivers':pushHist();state.dim=v;state.screen='drivers';window.scrollTo(0,0);break;
    case 'preset':{
      if(v==='month'){const ms=monthStartIdx(LAST);state.start=ms;state.end=LAST;const pms=monthStartIdx(ms-1);state.cmp={start:pms,end:Math.min(pms+(LAST-ms),monthEndIdx(ms-1))};state.preset='month'}
      else if(v==='prevmonth'){const ms=monthStartIdx(LAST);const pe=ms-1,ps=monthStartIdx(pe);state.start=ps;state.end=pe;state.cmp={start:monthStartIdx(ps-1),end:ps-1};state.preset='prevmonth'}
      else{const n=+v;state.preset=n;state.end=LAST;state.start=LAST-n+1;state.cmp=null}
      state.page=1;break}
    case 'mode':state.mode=v;break;
    case 'chip':{const arr=state.f[el.dataset.k];const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);state.page=1;break}
    case 'unfilter':{const k=el.dataset.k;if(k==='blogger')state.f.blogger='';else{const arr=state.f[k];const i=arr.indexOf(v);if(i>=0)arr.splice(i,1)}state.page=1;break}
    case 'reset':state.f={platform:[],product:[],dest:[],channel:[],stream:[],scenario:[],offer:[],blogger:''};state.page=1;break;
    case 'dim':state.dim=v;delete state.sort.drivers;break;
    case 'paretoBy':state.paretoBy=v;break;
    case 'selProduct':state.sel.product=v;break;
    case 'selBlogger':state.sel.blogger=v||null;break;
    case 'selVideo':state.sel.video=v||null;break;
    case 'goProduct':pushHist();state.sel.product=v;state.screen='products';window.scrollTo(0,0);break;
    case 'openVideo':pushHist();state.sel.video=v;state.screen='videos';window.scrollTo(0,0);break;
    case 'col':state.cols[v]=!state.cols[v];break;
    case 'page':state.page=+v;break;
    case 'go':{
      const ins=(state._insights||[])[+el.dataset.i];if(!ins)return;const go=ins.go;pushHist();
      state.screen=go.screen;if(go.dim)state.dim=go.dim;
      if(go.f){for(const k in go.f)state.f[k]=go.f[k].slice()}
      if(go.sort)state.sort[go.screen]=Object.assign({},go.sort);
      if(go.product)state.sel.product=go.product;
      state.page=1;window.scrollTo(0,0);break;
    }
    default:return;
  }
  render();
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  switch(el.dataset.act){
    case 'start':{const d=dayOfIso(el.value);if(!isNaN(d)){state.start=clamp(d,0,state.end);state.preset=null;state.cmp=null}break}
    case 'end':{const d=dayOfIso(el.value);if(!isNaN(d)){state.end=clamp(d,state.start,LAST);state.preset=null;state.cmp=null}break}
    case 'cp':state.cp=clamp(parseInt(el.value,10)||7,1,30);break;
    case 'target':state.targets[el.dataset.k]=Math.max(1,parseFloat(el.value)||1);break;
    case 'blogger':state.f.blogger=el.value;state.page=1;break;
    default:return;
  }
  render();
});

// ---------- tooltip ----------
const tipEl=document.getElementById('tip');
function moveTip(e){const w=tipEl.offsetWidth,h=tipEl.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>window.innerWidth-8)x=e.clientX-w-10;if(y+h>window.innerHeight-8)y=e.clientY-h-10;tipEl.style.left=x+'px';tipEl.style.top=y+'px'}
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(!el||!el.dataset.tip){tipEl.classList.remove('show');return}tipEl.textContent=el.dataset.tip;tipEl.classList.add('show');moveTip(e)});
document.addEventListener('mousemove',e=>{if(tipEl.classList.contains('show'))moveTip(e)});
document.addEventListener('mouseleave',()=>tipEl.classList.remove('show'));

render();
</script>
